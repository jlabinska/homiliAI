<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="EN">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>

<h2>Login</h2>

<!-- Display error message if login fails -->
<div th:if="${param.error}">
  <p style="color: red;">Invalid username or password. Please try again.</p>
</div>

<!-- Display success message if logout is successful -->
<div th:if="${param.logout}">
  <p style="color: green;">You have been logged out successfully.</p>
</div>

<!-- Login form -->
<form th:action="@{/auth/login}" th:object="${user}" method="post">
  <label>Username: </label>
  <input type="text" th:field="*{username}" name="username" required/><br/>

  <label>Password: </label>
  <input type="password" th:field="*{password}" name="password" required/><br/>

  <button type="submit">Login</button>
</form>

</body>
</html>
